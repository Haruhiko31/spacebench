<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="sg" cx="37%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#b8e0ff"/>
      <stop offset="30%"  stop-color="#3b8fda"/>
      <stop offset="70%"  stop-color="#1044a0"/>
      <stop offset="100%" stop-color="#060e28"/>
    </radialGradient>

    <!-- Clip: only show things ABOVE centre line (back of orbit) -->
    <clipPath id="back">
      <rect x="0" y="0"  width="100" height="50"/>
    </clipPath>
    <!-- Clip: only show things BELOW centre line (front of orbit) -->
    <clipPath id="front">
      <rect x="0" y="50" width="100" height="50"/>
    </clipPath>
    <!-- Clip: everything EXCEPT the planet disc (satellite hidden behind planet) -->
    <clipPath id="outside-planet">
      <path d="M0,0 H100 V100 H0 Z M50,50 m-27,0 a27,27 0 1,0 54,0 a27,27 0 1,0 -54,0"/>
    </clipPath>
  </defs>

  <!-- ── Orbit back arc (dashed, behind planet) ───────────────────── -->
  <ellipse cx="50" cy="50" rx="44" ry="16"
           fill="none"
           stroke="#a0d4ff" stroke-width="1.8" stroke-opacity="0.4"
           stroke-dasharray="5 3.5"
           clip-path="url(#back)"/>

  <!-- ── Planet ───────────────────────────────────────────────────── -->
  <circle cx="50" cy="50" r="27" fill="url(#sg)"/>
  <ellipse cx="41" cy="39" rx="10" ry="7"
           fill="white" fill-opacity="0.09"
           transform="rotate(-20 41 39)"/>

  <!-- ── Orbit front arc (solid, in front of planet) ──────────────── -->
  <ellipse cx="50" cy="50" rx="44" ry="16"
           fill="none"
           stroke="#a0d4ff" stroke-width="1.8" stroke-opacity="0.9"
           clip-path="url(#front)"/>

  <!-- ── Satellite — BACK half (clipped outside planet + above centre) -->
  <!-- Visible only when passing behind: top half, outside planet disc  -->
  <g clip-path="url(#back)">
    <g clip-path="url(#outside-planet)">
      <circle r="3.2" fill="rgba(160,212,255,0.55)">
        <animateMotion dur="9s" repeatCount="indefinite">
          <mpath href="#orbit"/>
        </animateMotion>
      </circle>
    </g>
  </g>

  <!-- ── Satellite — FRONT half (below centre line, always in front) ─ -->
  <g clip-path="url(#front)">
    <g>
      <!-- Solar panels -->
      <rect width="5" height="1.5" x="-8.2" y="-0.75" rx="0.4" fill="#a0d4ff">
        <animateMotion dur="9s" repeatCount="indefinite">
          <mpath href="#orbit"/>
        </animateMotion>
      </rect>
      <rect width="5" height="1.5" x="3.2" y="-0.75" rx="0.4" fill="#a0d4ff">
        <animateMotion dur="9s" repeatCount="indefinite">
          <mpath href="#orbit"/>
        </animateMotion>
      </rect>
      <!-- Body -->
      <circle r="3.2" fill="white">
        <animateMotion dur="9s" repeatCount="indefinite">
          <mpath href="#orbit"/>
        </animateMotion>
      </circle>
    </g>
  </g>

  <!-- ── Orbit path definition (invisible, used by animateMotion) ──── -->
  <!-- Ellipse cx=50 cy=50 rx=44 ry=16, starting from right (94,50), clockwise -->
  <path id="orbit"
        d="M 94,50 A 44,16 0 0,1 6,50 A 44,16 0 0,1 94,50"
        fill="none" stroke="none"/>
</svg>
